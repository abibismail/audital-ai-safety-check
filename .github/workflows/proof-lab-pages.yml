name: Publish Outcome Proof Lab on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'outcome-proof-lab.html'
      - '.github/workflows/proof-lab-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: audital-public-proof-lab-pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'abibismail/audital-ai-safety-check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public repo only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Package only the static, zero-network demo
        shell: bash
        run: |
          set -euo pipefail
          test -s outcome-proof-lab.html
          grep -Fq "connect-src 'none'" outcome-proof-lab.html
          grep -Fq "SIMULATED" outcome-proof-lab.html
          mkdir -p _site
          cp outcome-proof-lab.html _site/index.html
          cp outcome-proof-lab.html _site/outcome-proof-lab.html
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy public demo
        id: deployment
        uses: actions/deploy-pages@v4
